server {
    listen 80;
    listen [::]:80;
    server_name yinxian.com.cn www.yinxian.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
    }

    location / {
        return 308 https://yinxian.com.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yinxian.com.cn;

    ssl_certificate /etc/letsencrypt/live/yinxian.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yinxian.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://yinxian.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yinxian.com.cn;

    ssl_certificate /etc/letsencrypt/live/yinxian.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yinxian.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/stock-watch/current/web;
    index index.html;
    client_max_body_size 1m;

    location /api/v1/auth/ {
        limit_req zone=stock_watch_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /www/server/nginx/conf/stock-watch-proxy.conf;
        proxy_read_timeout 30s;
    }

    location /api/v1/quotes/stream {
        proxy_pass http://127.0.0.1:8080;
        include /www/server/nginx/conf/stock-watch-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /www/server/nginx/conf/stock-watch-proxy.conf;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
