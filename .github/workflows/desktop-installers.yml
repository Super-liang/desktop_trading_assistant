name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_url:
        description: HTTPS API URL embedded in desktop installers
        required: true
        default: https://211.159.158.165
        type: string

permissions:
  contents: read

env:
  VITE_API_URL: ${{ inputs.api_url || 'https://211.159.158.165' }}

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Build macOS DMG and APP archive
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: deploy/desktop/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StockTradingAssistant-macos-arm64
          path: build/installers/*/macos-arm64/*
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build Windows NSIS and MSI installers
        run: npm --workspace apps/desktop run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis,msi
      - name: Verify cloud API in frontend
        shell: bash
        run: deploy/desktop/verify-frontend-api.sh apps/desktop/dist "${VITE_API_URL}"
      - name: Archive and hash Windows installers
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $output = "build/installers/$version/windows-x64"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $bundle = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $exe = Get-ChildItem "$bundle/nsis/*setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Tauri did not produce both NSIS and MSI installers" }
          $appExe = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/trading-assistant.exe"
          $bytes = [System.IO.File]::ReadAllBytes($appExe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Desktop executable is not x86_64 PE" }
          $exeOut = "$output/StockTradingAssistant_${version}_windows-x64-setup.exe"
          $msiOut = "$output/StockTradingAssistant_${version}_windows-x64.msi"
          Copy-Item $exe.FullName $exeOut
          Copy-Item $msi.FullName $msiOut
          $lines = @($exeOut, $msiOut) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          }
          $lines | Set-Content "$output/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: StockTradingAssistant-windows-x64
          path: build/installers/*/windows-x64/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: StockTradingAssistant-macos-arm64
          path: release-assets/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: StockTradingAssistant-windows-x64
          path: release-assets/windows-x64
      - name: Verify version and prepare uniquely named assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
          bash deploy/desktop/prepare-release-assets.sh "${version}" release-assets publish
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/desktop/publish-github-release.sh \
          "${GITHUB_REF_NAME}" "${RELEASE_VERSION}" publish
